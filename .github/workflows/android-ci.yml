name: Android CI

on:
    push:
        branches:
            - main
            - feature-branch
    pull_request:
        branches:
            - main

jobs:
    lint:
        name: Ktlint Check

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 17

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v5

            - name: Set execute permissions for gradle
              run: chmod +x gradlew

            - name: Run ktlintCheck
              run: ./gradlew ktlintCheck


    build:
        name: Gradle Build
        needs: lint
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5

            -   name: Setup JDK 17
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 17

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v5

            -   name: Set execute permissions for gradle
                run: chmod +x gradlew

            - name: Build with Gradle
              run: ./gradlew assembleDebug

